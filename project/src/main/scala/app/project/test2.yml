#!/bin/bash
# file: convert_junit_to_xray_json.sh

  set -e
  
  if [ $# -ne 2 ]; then
echo "Usage: $0 <surefire-report-dir> <output-json-file>"
  exit 1
  fi
  
  REPORT_DIR="$1"
  OUTPUT_FILE="$2"

# Prepare the JSON array
echo '{"tests": [' > "$OUTPUT_FILE"

FIRST=1
for FILE in "$REPORT_DIR"/TEST-*.xml; do
  grep -oP '<testcase[^>]*name="\K[^"]+' "$FILE" | while read -r NAME; do
  if [[ "$NAME" =~ ([A-Z][A-Z0-9]+-[0-9]+) ]]; then
  KEY="${BASH_REMATCH[1]}"

      if grep -A5 "name=\"$NAME\"" "$FILE" | grep -q "<failure\|<error"; then
  STATUS="FAILED"
  elif grep -A5 "name=\"$NAME\"" "$FILE" | grep -q "<skipped"; then
  STATUS="SKIPPED"
  else
  STATUS="PASSED"
  fi

  [ $FIRST -eq 0 ] && echo "," >> "$OUTPUT_FILE"
    FIRST=0
    
    echo "  {" >> "$OUTPUT_FILE"
    echo "    \"testKey\": \"$KEY\"," >> "$OUTPUT_FILE"
    echo "    \"status\": \"$STATUS\"," >> "$OUTPUT_FILE"
    echo "    \"comment\": \"$NAME\"," >> "$OUTPUT_FILE"
    echo "    \"steps\": []" >> "$OUTPUT_FILE"
                           echo -n "  }" >> "$OUTPUT_FILE"
    fi
    done
    done
    
    echo ']}' >> "$OUTPUT_FILE"
echo "✅ Xray JSON generated: $OUTPUT_FILE"

-------------
// curl à priori fonctionnel sans json
curl -H "Content-Type: multipart/form-data" \
  -H "Authorization: Bearer $XRAY_TOKEN" \
  -F "results=@target/surefire-reports/TEST-SampleTest.xml" \
  "https://xray.cloud.getxray.app/api/v2/import/execution/junit"

